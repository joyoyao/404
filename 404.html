<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>页面不存在 | 帽子云</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e3e5e8;
      font-family: "PingFang SC", "Microsoft YaHei", "Work Sans", sans-serif;
      color: #46484a;
    }

    main {
      width: min(640px, calc(100% - 48px));
      text-align: center;
    }

    .code {
      margin: 0;
      font-size: 72px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 12px 0;
      font-size: 28px;
      font-weight: 400;
    }

    p {
      margin: 0;
      color: #787878;
      font-size: 18px;
      line-height: 1.8;
    }

    a.button {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 28px;
      background: #5c93ed;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      border-radius: 5px;
    }

    a.button:hover {
      background: #4b82dc;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>页面不存在</h1>
    <p>你访问的页面没有找到，可能已被移动或删除。</p>
    <a class="button" href="/">返回首页</a>
  </main>
</body>
</html>
